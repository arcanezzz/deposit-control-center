# Deposit Control Center — run everything with:  docker compose up --build
# All values below are LOCAL DEV defaults (no real secrets). Override via .env (see .env.example).

name: deposit-control-center

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_local_dev}@postgres:5432/${POSTGRES_DB:-deposits}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: deposit-requests
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-deposits}
      TZ: Asia/Jerusalem
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------- Kafka (KRaft, single broker)
  kafka:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw     # fixed so the persisted volume is reused on restart
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"    # topics are created explicitly by kafka-init
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9094}:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Creates the topic once (idempotent: --if-not-exists), then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server=kafka:9092
      - --create
      - --if-not-exists
      - --topic=deposit-requests
      - --partitions=3
      - --replication-factor=1
    restart: "no"

  # ---------------------------------------------------------------- Schema + seed (one-shot)
  migrate:
    build: ./backend
    command: ["python", "-m", "app.migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- REST API + outbox relay
  api:
    build: ./backend
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *backend-env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Kafka is intentionally NOT a hard dependency: thanks to the outbox the API accepts
      # deposits even while Kafka is down; the relay publishes them once Kafka is back.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------- Data viewers (dev tools)
  adminer:
    image: adminer:4.8.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_HOST_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
