server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS: re-resolve "api" at request time, so restarting the api
    # container (new IP) never breaks the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /docs         { proxy_pass $api_upstream; }
    location = /openapi.json { proxy_pass $api_upstream; }

    # Hashed assets can be cached forever; index.html must not be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths (/execute, /investigate?..) fall back to index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
